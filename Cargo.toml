[workspace]
resolver = "2"
members = [
    "crates/aichip-shared",
    "crates/aichip-engines",
    "crates/aichip-core",
    "crates/aichip-server",
    "crates/aichip-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/neiellcare/aichip"

[workspace.dependencies]
aichip-shared = { path = "crates/aichip-shared" }
aichip-engines = { path = "crates/aichip-engines" }
aichip-core = { path = "crates/aichip-core" }
aichip-server = { path = "crates/aichip-server" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
rand = "0.9"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
