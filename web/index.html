<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Eren</title>
    <script>
      // Before first paint, so a dark reload never flashes white. Mirrors
      // lib/theme.tsx: same key, same rule, every storage access guarded.
      // The old key too, on the one load before lib/brand.ts has moved it.
      (function () {
        var choice = "system";
        try {
          var v = localStorage.getItem("eren.theme") || localStorage.getItem("aichip.theme");
          if (v === "light" || v === "dark" || v === "system") choice = v;
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
