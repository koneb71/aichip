[package]
name = "aichip-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aichip-shared = { workspace = true }
aichip-core = { workspace = true }
aichip-engines = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
sqlx = { workspace = true }
serde_yaml = "0.9"
croner = "3"
futures = "0.3"
# Only for the "test this MCP server" probe. rustls rather than native-tls so
# the check behaves the same in the container as it does on a Mac.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
