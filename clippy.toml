# Every child process goes through `aichip_shared::env_guard::command`, which
# strips the secrets aichip holds before the child inherits its environment.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "use aichip_shared::env_guard::command, which strips AICHIP_OWN_SECRETS" },
    { path = "tokio::process::Command::new", reason = "use aichip_shared::env_guard::command, which strips AICHIP_OWN_SECRETS" },
]
