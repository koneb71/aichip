# Every child process goes through `eren_shared::env_guard::command`, which
# strips the secrets Eren holds before the child inherits its environment.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "use eren_shared::env_guard::command, which strips EREN_OWN_SECRETS" },
    { path = "tokio::process::Command::new", reason = "use eren_shared::env_guard::command, which strips EREN_OWN_SECRETS" },
]
