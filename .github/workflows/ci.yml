# Build and test on every push and pull request.
#
# Both suites run without a model and without a network call to any provider:
# the Rust tests drive the mock engine, which replays recorded stream fixtures,
# and the web tests are pure vitest over the logic in web/src/lib. Nothing here
# needs an API key or a subscription. The Rust job brings a throwaway Postgres
# for the tests that exercise SQL (see crates/eren-core/src/testdb.rs); each
# makes and drops a database of its own, and they skip where none is set.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eren
          POSTGRES_PASSWORD: eren
          POSTGRES_DB: eren
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on Cargo.lock: the workspace has a large dependency tree and a
      # cold build is most of the run time.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Advisory, not blocking. There is a standing backlog of lints here
      # (mostly needless borrows and a few long argument lists) and turning
      # them into a red build before they are fixed would train everyone to
      # ignore the colour. Promote this to `-D warnings` once the backlog is
      # clear; until then it is a list to work from.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      - name: Tests
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://eren:eren@localhost:5432/eren

  web:
    name: pnpm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # No version here: it is read from `packageManager` in web/package.json,
      # the same pin corepack uses in the Docker build. Naming it twice is an
      # error in this action, and two places for it is how they drift.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc -b

      - name: Tests
        run: pnpm test

      # The dashboard the server serves is web/dist, so a build that fails is
      # a broken release even when every test passes.
      - name: Build
        run: pnpm build
